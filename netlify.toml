# One codebase, one Netlify site per brand. Set BRAND in each site's environment
# variables (rwc = Redefining Wellness Center, bb = Biohacking Bombshell); it picks the
# front end built into dist/ and the wording/GHL tag the functions use.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The browser now talks only to this site (/api/*); Claude and Zapier are called
# server-side, so api.anthropic.com and hooks.zapier.com are no longer needed here.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;"
